<!doctype html>
<meta charset="utf-8">
<title>New tab</title>
<style>
  :root { --bg:#141416; --surface:#1e1e22; --line:#2b2b31; --text:#e6e6ea; --muted:#8d8d96; --accent:#8a6df5; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; padding: 4vh 0 6vh; }
  .logo { width: 120px; height: 120px; }
  .word { margin: 6px 0 22px; font-size: 22px; font-weight: 600; letter-spacing: .32em; padding-left: .32em; }
  #time { display: flex; align-items: baseline; gap: 2px; font-size: 68px; font-weight: 300; letter-spacing: -.02em; line-height: 1;
    font-variant-numeric: tabular-nums; }
  #time .s { color: var(--accent); font-size: 38px; margin-left: 4px; }
  #time .p { color: var(--muted); font-size: 18px; margin-left: 8px; letter-spacing: 0; }
  #date { color: var(--muted); margin: 10px 0 30px; }
  input { width: min(580px, 88vw); height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 15px; outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  .dial { display: grid; grid-template-columns: repeat(auto-fill, 104px); justify-content: center; gap: 10px;
    width: min(820px, 94vw); margin-top: 34px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 6px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted);
    text-decoration: none; font-size: 12px; }
  .tile:hover { border-color: var(--accent); color: var(--text); }
  .tile i { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--bg);
    color: var(--text); font: normal 600 15px "Segoe UI", sans-serif; overflow: hidden; }
  .tile i img { width: 22px; height: 22px; }
  .tile span { max-width: 92px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile b { position: absolute; top: 4px; right: 5px; display: none; width: 18px; height: 18px; line-height: 17px; text-align: center;
    border-radius: 5px; font-weight: 400; color: var(--muted); }
  .tile:hover b { display: block; }
  .tile b:hover { background: var(--line); color: var(--text); }
  button.add { cursor: pointer; font: inherit; font-size: 12px; background: none; border-style: dashed; }
  button.add i { font-size: 20px; font-weight: 300; background: none; }
  form { display: none; gap: 8px; margin-top: 16px; }
  form.on { display: flex; }
  form input { width: 180px; height: 38px; font-size: 13px; padding: 0 12px; border-radius: 9px; }
  form button { height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  form button.x { background: var(--surface); color: var(--muted); }
</style>
<img class="logo" src="assets/logo.png" alt="">
<div class="word">VEXORA</div>
<div id="time"></div>
<div id="date"></div>
<input id="q" autofocus autocomplete="off" spellcheck="false" placeholder="Search or enter address">
<div class="dial" id="dial"></div>
<form id="form">
  <input id="fn" placeholder="Name" autocomplete="off">
  <input id="fu" placeholder="Address" autocomplete="off">
  <button>Add</button><button type="button" class="x" id="fx">Cancel</button>
</form>
<script src="resolve.js"></script>
<script>
  const P = new URLSearchParams(location.search);
  for (const k of ['bg', 'surface', 'line', 'text', 'muted', 'accent'])
    if (P.get(k)) document.documentElement.style.setProperty('--' + k, P.get(k));

  const fmt = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  function tick() {
    const d = new Date(), main = [], parts = fmt.formatToParts(d);
    time.replaceChildren();
    for (const p of parts) {
      if (p.type === 'second') { const s = document.createElement('span'); s.className = 's'; s.textContent = ':' + p.value; time.append(s); }
      else if (p.type === 'dayPeriod') { const s = document.createElement('span'); s.className = 'p'; s.textContent = p.value; time.append(s); }
      else if (p.type !== 'literal') main.push(p.value);
    }
    time.prepend(main.join(':'));
    const h = d.getHours(), g = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    date.textContent = g + ' · ' + d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  q.addEventListener('keydown', e => { if (e.key === 'Enter' && q.value.trim()) location.href = resolve(q.value, P.get('e')); });

  const DEFAULT = [['YouTube', 'https://www.youtube.com'], ['GitHub', 'https://github.com'], ['Wikipedia', 'https://www.wikipedia.org'],
    ['Reddit', 'https://www.reddit.com'], ['Gmail', 'https://mail.google.com'], ['Maps', 'https://maps.google.com']];
  let sites;
  try { sites = JSON.parse(localStorage.getItem('vx.dial')) || DEFAULT; } catch { sites = DEFAULT; }
  const save = () => { try { localStorage.setItem('vx.dial', JSON.stringify(sites)); } catch {} };
  const key = u => { try { return new URL(u).hostname.replace(/[^A-Za-z0-9._-]/g, '_'); } catch { return ''; } };

  function draw() {
    dial.replaceChildren();
    sites.forEach(([n, u], i) => {
      const a = document.createElement('a'); a.className = 'tile'; a.href = u;
      const ic = document.createElement('i'); ic.textContent = n[0].toUpperCase();
      if (P.get('icons') && key(u)) {                      // real site icon, once you have visited the site
        const im = new Image(); im.src = P.get('icons') + key(u) + '.png';
        im.onload = () => { ic.textContent = ''; ic.append(im); };
      }
      const lb = document.createElement('span'); lb.textContent = n;
      const x = document.createElement('b'); x.textContent = '×'; x.title = 'Remove';
      x.onclick = e => { e.preventDefault(); sites.splice(i, 1); save(); draw(); };
      a.append(ic, lb, x); dial.append(a);
    });
    const add = document.createElement('button'); add.className = 'tile add';
    const plus = document.createElement('i'); plus.textContent = '+';
    add.append(plus, 'Add'); add.onclick = () => { form.classList.add('on'); fn.focus(); };
    dial.append(add);
  }
  draw();
  fx.onclick = () => form.classList.remove('on');
  form.onsubmit = e => {
    e.preventDefault();
    const u = resolve(fu.value);
    if (fn.value.trim() && /^https?:/.test(u)) { sites.push([fn.value.trim(), u]); save(); draw(); form.reset(); form.classList.remove('on'); }
  };
</script>
