name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the built-in token create releases in THIS repo

env:
  RELEASES_REPO: ${{ github.repository }}   # same repo: spaceairagency-blip/Vexora

jobs:
  # ---------------------------------------------------------------
  # Windows: installer, patch, update.json (creates the release)
  # ---------------------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Stamp version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" version.py
          sed -i "s#^REPO = .*#REPO = \"$RELEASES_REPO\"#" version.py
          echo "V=$V" >> "$GITHUB_ENV"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name Vexora --icon assets/icon.ico
          --add-data "trackers.json;."
          --add-data "assets;assets" main.py

      - name: Trim unused Qt parts and fingerprint the heavy base
        run: |
          python tools/build_tools.py prune dist/Vexora
          python tools/build_tools.py baseid dist/Vexora

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:V" installer.iss

      - name: Build small update patch and manifest
        run: python tools/build_tools.py manifest dist/Vexora dist-installer

      - name: Publish release to this repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-installer
          sha256sum Vexora-Setup.exe | cut -d' ' -f1 > Vexora-Setup.exe.sha256
          gh release create "$GITHUB_REF_NAME" Vexora-Setup.exe Vexora-Setup.exe.sha256 Vexora-Patch.zip update.json \
            --repo "$RELEASES_REPO" --title "Vexora $V" --notes "Vexora $V"

  # ---------------------------------------------------------------
  # Linux: tar.gz build (waits for the release to exist, then adds to it)
  # ---------------------------------------------------------------
  build-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Install system libraries for Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-image0 libxcb-render-util0 libxkbfile1 libasound2 libegl1 libgl1

      - name: Stamp version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" version.py
          sed -i "s#^REPO = .*#REPO = \"$RELEASES_REPO\"#" version.py

      - run: pip install -r requirements.txt pyinstaller

      - name: Build app
        run: >
          pyinstaller --noconfirm --name Vexora
          --add-data "trackers.json:."
          --add-data "assets:assets" main.py

      - name: Package and upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf Vexora-Linux-x86_64.tar.gz -C dist Vexora
          sha256sum Vexora-Linux-x86_64.tar.gz | cut -d' ' -f1 > Vexora-Linux-x86_64.tar.gz.sha256
          gh release upload "$GITHUB_REF_NAME" \
            Vexora-Linux-x86_64.tar.gz Vexora-Linux-x86_64.tar.gz.sha256 \
            --repo "$RELEASES_REPO"
