<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src vexora://app; style-src vexora://app 'unsafe-inline'; img-src vexora://app data:; connect-src vexora://app https://api.open-meteo.com https://geocoding-api.open-meteo.com">
<title>New Tab</title>
<link rel="icon" href="vexora://app/logo.png">
<link rel="stylesheet" href="vexora://app/newtab.css">
</head>
<body>
<div id="bg">
  <svg id="aurora" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    </defs>
    <path d="M-100 760 C 180 560, 460 880, 800 700 S 1250 420, 1720 560 L1720 980 L-100 980 Z" fill="url(#g1)" opacity=".30" filter="url(#blur)"/>
    <path d="M900 -60 C 1100 220, 1260 120, 1420 300 S 1560 520, 1720 470 L1720 -60 Z" fill="url(#g2)" opacity=".26" filter="url(#blur)"/>
    <path d="M-60 640 C 220 470, 470 780, 820 610 S 1260 360, 1680 470" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity=".55"/>
    <path d="M-60 690 C 240 520, 480 830, 830 660 S 1270 410, 1680 520" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity=".35"/>
    <path d="M1000 -20 C 1180 200, 1300 150, 1450 330 S 1600 540, 1700 500" fill="none" stroke="url(#g2)" stroke-width="2" opacity=".5"/>
  </svg>
  <div id="wall"></div>
  <div id="shade"></div>
</div>

<main id="page">
  <a id="card" class="glass" href="#" hidden>
    <svg class="ic crown" viewBox="0 0 24 24"></svg>
    <div><b>Vexora</b><small>Browse Beyond Limits.</small></div>
    <svg class="ic chev" viewBox="0 0 24 24"></svg>
  </a>

  <section id="weather" class="glass" hidden></section>

  <div id="center">
    <img id="logo" src="vexora://app/logo.png" alt="">
    <div id="word">VEXORA</div>
    <div id="clock"></div>
    <div id="date"></div>
    <div id="greeting"></div>
    <form id="search" autocomplete="off">
      <button type="button" id="engbtn" title="Search engine"></button>
      <input id="q" spellcheck="false">
      <button id="go" title="Search"><svg class="ic" viewBox="0 0 24 24"></svg></button>
      <div id="engmenu" class="menu" hidden></div>
    </form>
    <div id="tiles"></div>
  </div>

  <div id="widgets">
    <section id="recents" class="glass"><header><svg class="ic" viewBox="0 0 24 24"></svg><h2>Recently Visited</h2><a href="#" data-panel="history">View all <svg class="ic" viewBox="0 0 24 24"></svg></a></header><div class="body"></div></section>
    <section id="bookmarks" class="glass"><header><svg class="ic" viewBox="0 0 24 24"></svg><h2>Bookmarks</h2><a href="#" data-panel="bookmarks">View all <svg class="ic" viewBox="0 0 24 24"></svg></a></header><div class="body"></div></section>
    <section id="notes" class="glass"><header><svg class="ic" viewBox="0 0 24 24"></svg><h2>Quick Notes</h2><button id="notefocus" title="Edit"><svg class="ic" viewBox="0 0 24 24"></svg></button></header><textarea id="note" maxlength="20000" placeholder="Write a note…" spellcheck="false"></textarea><small id="saved"></small></section>
  </div>

  <button id="custom" class="glass"><svg class="ic" viewBox="0 0 24 24"></svg>Customize Home Page</button>
</main>

<aside id="panel" class="glass" hidden>
  <header><h2>Customize Home Page</h2><button id="pclose" title="Close"><svg class="ic" viewBox="0 0 24 24"></svg></button></header>
  <h3>Widgets</h3><div id="switches"></div>
  <h3>About you</h3>
  <label>Your name<input id="pname" maxlength="40" placeholder="Used in the greeting"></label>
  <label>City for weather<input id="pcity" maxlength="80" placeholder="e.g. Dhaka"></label>
  <p class="hint">The city name is sent to Open-Meteo to get the forecast. Nothing is sent until you enter one.</p>
  <div class="seg" id="units"><button data-u="C">°C</button><button data-u="F">°F</button></div>
  <h3>Wallpaper</h3>
  <div class="row"><button id="wpick">Choose image…</button><button id="wreset" class="ghost">Use default</button></div>
  <h3>Shortcuts</h3>
  <div class="row"><button id="sreset" class="ghost">Restore default shortcuts</button></div>
</aside>

<div id="modal" hidden><form class="glass" id="mform">
  <h2 id="mtitle">Add shortcut</h2>
  <label>Name<input id="mname" maxlength="40" autocomplete="off"></label>
  <label>Address<input id="murl" autocomplete="off" placeholder="example.com"></label>
  <p id="merr" class="hint err"></p>
  <div class="row"><button>Save</button><button type="button" id="mcancel" class="ghost">Cancel</button></div>
</form></div>
<div id="ctx" class="menu" hidden></div>
<script src="vexora://app/newtab.js"></script>
</body>
</html>
